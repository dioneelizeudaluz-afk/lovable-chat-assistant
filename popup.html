<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#667eea">
    <title>Lovable Chat Assistant</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="header-content">
                <h1>Lovable Chat Assistant</h1>
                <div class="project-info">
                    <span class="project-label">Projeto:</span>
                    <span id="projectId" class="project-id">Carregando...</span>
                </div>
            </div>
        </header>

        <div class="chat-area" id="chatArea">
            <div class="messages" id="messages">
                <div class="welcome-message">
                    <p>Bem-vindo ao Lovable Chat Assistant!</p>
                    <p>Envie mensagens para interagir com a IA do seu projeto.</p>
                    <p>💡 Dica: Use Shift+Enter para nova linha</p>
                </div>
            </div>
        </div>

        <div class="file-preview-area" id="filePreviewArea" style="display: none;">
            <div class="file-preview-header">
                <span>Arquivos anexados:</span>
            </div>
            <div id="filePreviews" class="file-previews"></div>
        </div>

        <div class="input-area">
            <div class="input-container">
                <button id="attachButton" class="attach-button" title="Anexar arquivos" aria-label="Anexar arquivos">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/>
                    </svg>
                </button>
                <input type="file" id="fileInput" multiple style="display: none;" accept="*/*">
                <textarea id="messageInput" placeholder="Digite sua mensagem..." rows="1" enterkeyhint="send"></textarea>
                <button id="sendButton" class="send-button" title="Enviar mensagem" aria-label="Enviar mensagem">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="22" y1="2" x2="11" y2="13"/>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"/>
                    </svg>
                </button>
            </div>
        </div>

        <div id="statusBar" class="status-bar"></div>
    </div>

    <script src="popup.js"></script>
</body>
                  </html>
