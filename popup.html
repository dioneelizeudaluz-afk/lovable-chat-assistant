<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lovable Chat Assistant</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="header-content">
                <h1>Lovable Chat Assistant</h1>
                <div class="project-info">
                    <span class="project-label">Projeto:</span>
                    <span id="projectId" class="project-id">Carregando...</span>
                </div>
                <div class="credit-control">
                    <span id="creditIndicator" class="credit-indicator active">🔒 Créditos Protegidos</span>
                    <label class="toggle-switch">
                        <input type="checkbox" id="creditToggle" checked>
                        <span class="toggle-slider"></span>
                    </label>
                </div>
            </div>
        </header>

        <div class="chat-area" id="chatArea">
            <div class="messages" id="messages">
                <div class="welcome-message">
                    <p>Bem-vindo ao Lovable Chat Assistant!</p>
                    <p>🔒 Créditos bloqueados automaticamente</p>
                    <p>Envie mensagens sem consumir créditos</p>
                </div>
            </div>
        </div>

        <div class="input-area">
            <div class="input-container">
                <textarea id="messageInput" placeholder="Digite sua mensagem..." rows="1"></textarea>
                <button id="sendButton" class="send-button" title="Enviar">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="22" y1="2" x2="11" y2="13"/>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"/>
                    </svg>
                </button>
            </div>
        </div>

        <div id="statusBar" class="status-bar"></div>
    </div>

    <script src="popup.js"></script>
</body>
</html>
